# Additive ComfyUI model paths for photoreal_ai_app.
# Pass to Comfy with:
#   --extra-model-paths-config <repo-root>/comfyui_extra_model_paths.yaml
# Do not edit runtime/comfyui internals for path wiring.

photoreal_data:
  base_path: data/
  checkpoints: models/flux2/klein-base-9b/
  unet: models/flux2/klein-base-9b/
  diffusion_models: models/flux2/klein-base-9b/
  vae: models/flux2/klein-base-9b/
  text_encoders: models/flux2/klein-base-9b/text_encoder/
  clip: models/flux2/klein-base-9b/text_encoder/
  loras: models/loras/
  embeddings: models/embeddings/

# SAM 3.1 multiplex checkpoint (sam3_segment ability)
photoreal_sam3:
  base_path: data/
  checkpoints: models/sam3/

# Depth Anything 3 (depth_subject ability)
photoreal_depth:
  base_path: data/
  geometry_estimation: models/depth_anything3/

# Wan2.2 Animate (wan_animate ability — Animation / Move mode)
photoreal_wan:
  base_path: data/
  diffusion_models: models/wan/diffusion_models/
  text_encoders: models/wan/text_encoders/
  vae: models/wan/vae/
  clip_vision: models/wan/clip_vision/
  loras: models/wan/loras/
  detection: models/wan/detection/
