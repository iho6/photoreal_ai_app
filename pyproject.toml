[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photoreal"
version = "0.1.0"
description = "Photoreal AI generation app — hybrid orchestration with pluggable pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
photoreal = "photoreal.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["photoreal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
