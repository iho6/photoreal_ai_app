[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photoreal"
version = "0.1.0"
description = "Photoreal AI generation app — hybrid orchestration with pluggable pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Stage-1 launch portal only (no torch / Comfy)
portal = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]
# Glue only — ComfyUI runtime deps: requirements/comfyui-photoreal.txt
# (not runtime/comfyui/requirements.txt)
photoreal-gen = [
    "huggingface_hub>=0.26.0",
    "httpx>=0.27.0",
    "websocket-client>=1.8.0",
]
vlm = [
    "huggingface_hub>=0.26.0",
    "transformers>=4.57.0",
    "accelerate>=1.0.0",
    "torchvision>=0.19.0",
    "Pillow>=10.0.0",
]

[project.scripts]
photoreal = "photoreal.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["photoreal*"]

[tool.setuptools.package-data]
photoreal = ["pipelines/vision/prompts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
